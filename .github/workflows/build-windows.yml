name: Build Teto for Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Record the baked-in code (for small self-updates later)
        run: python -c "from teto.updater import write_build_manifest; write_build_manifest('.', r'assets\build_manifest.json')"

      - name: Build Teto.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name Teto --icon assets\teto.ico --add-data "assets;assets"
          --collect-all claude_agent_sdk --collect-all playwright --collect-all uiautomation
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --hidden-import pynput._util.win32 --hidden-import pynput._util.win32_vks --hidden-import six
          main.py

      - name: Check the build
        run: |
          $p = Start-Process -Wait -PassThru dist\Teto\Teto.exe -ArgumentList '--selftest','--browser'
          Get-Content "$env:APPDATA\TetoAgent\teto.log" -ErrorAction SilentlyContinue | Out-Host
          if ($p.ExitCode -ne 0) { throw "Teto self-test failed" }
          if (-not (Test-Path dist\Teto\_internal\claude_agent_sdk\_bundled\claude.exe)) { throw "Claude Code CLI missing from build" }

      - name: Zip
        run: Compress-Archive -Path dist\Teto -DestinationPath Teto-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Teto-Windows
          path: Teto-Windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Teto-Windows.zip
